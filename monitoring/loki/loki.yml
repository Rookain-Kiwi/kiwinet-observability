# loki.yml : Configuration de Loki (agrégateur de journaux)
# Chargé au démarrage. Tout changement nécessite un redémarrage du conteneur.

auth_enabled: false   # Pas de multi-tenant : usage interne, réseau `monitoring` uniquement

server:
  http_listen_port: 3100   # API HTTP : utilisée par Alloy (écriture) et Grafana (lecture)

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Rétention des journaux : 15 jours. Appliquée par le compacteur (bloc ci-dessous) ;
  # sans lui, les journaux sont conservés indéfiniment.
  retention_period: 360h
  reject_old_samples: true
  reject_old_samples_max_age: 168h   # refuse les entrées de plus de 7 jours (ingestion tardive)

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false   # pas de télémétrie vers Grafana Labs
