###############################################################################
# docker-compose.yml : Stack de supervision interne
# Projet  : kiwinet.me — serveur x86 (Debian 13)
# Contenu : Prometheus, cAdvisor, Node Exporter (métriques) ; Loki et Grafana
#           Alloy (journaux) ; Grafana (tableaux de bord et alertes)
# Accès   : https://grafana.kiwinet.me (via Traefik : limitation de débit,
#           authentification de base, puis connexion Grafana)
# Secrets : fichier .env local, ignoré par Git (voir env.example) ; mot de passe de la
#           base de Grafana en secret Docker (fichier hors dépôt, voir plus bas)
# Détail des choix : README.md et Décisions (Stack) dans le second brain Notion
###############################################################################

# Rotation des journaux Docker : le pilote par défaut n'en fait aucune
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Durcissement commun : élévation de privilèges interdite, aucune capacité
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:

  # ───────────────────────────────────────────────────────────────────────────
  # PROMETHEUS : collecte et stockage des métriques
  # Rétention : 30 jours ou 10 Go, selon la première limite atteinte
  # ───────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    <<: *hardening
    logging: *default-logging
    # Atteindre Node Exporter, qui tourne en réseau hôte (voir plus bas)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=10GB"
    networks:
      monitoring:
      traefik-metrics:
        # Adresse fixe : Traefik demande .10 sur ce réseau ; sans réservation,
        # Prometheus (démarré en parallèle) peut la prendre et Traefik ne démarre pas.
        ipv4_address: 172.31.255.11
    deploy:
      resources:
        limits:
          memory: 512M

  # ───────────────────────────────────────────────────────────────────────────
  # CADVISOR : métriques par conteneur (CPU, mémoire, réseau)
  # Conteneur très privilégié par nature : l'image officielle exige `privileged`
  # et l'accès au socket Docker. Risque assumé, limité par le réseau (aucun port
  # publié, réseau `monitoring` seulement). Voir README.
  # ───────────────────────────────────────────────────────────────────────────
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6@sha256:b8e7d1093144fd088f425ff003d75a4aa405de075db78dae3bc563730b1bd07a
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    logging: *default-logging
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      # Intervalle de collecte : 30 s (1 s par défaut, source principale de charge CPU)
      - "--housekeeping_interval=30s"
      # Collecteurs inutiles désactivés (disk/diskIO : le parcours des overlayfs
      # saturait la mémoire, constaté en 2026-06)
      - "--disable_metrics=cpu_topology,cpuset,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp,disk,diskIO"
      # Pas de labels Docker dans les métriques (verbosité inutile), sauf le projet
      # et le service Compose : le tableau de bord cAdvisor filtre dessus.
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    networks:
      - monitoring

  # ───────────────────────────────────────────────────────────────────────────
  # NODE EXPORTER : métriques de l'hôte (CPU, mémoire, disques, réseau)
  # Réseau hôte et PID hôte, comme le demande la documentation officielle, sans
  # quoi il mesure le conteneur et non la machine. Conséquence : il écoute sur la
  # machine, hors de Docker, donc hors des règles DOCKER-USER. Seul ufw le filtre :
  # une règle n'autorise que le pont `br-monitoring` (voir README).
  # ───────────────────────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    user: "65534:65534"
    read_only: true
    <<: *hardening
    logging: *default-logging
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=${NODE_EXPORTER_LISTEN:-0.0.0.0:9100}"
    deploy:
      resources:
        limits:
          memory: 128M

  # ───────────────────────────────────────────────────────────────────────────
  # LOKI : stockage et interrogation des journaux
  # Rétention : 15 jours (compacteur, voir loki/loki.yml)
  # ───────────────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    container_name: loki
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    <<: *hardening
    logging: *default-logging
    tmpfs:
      - /tmp
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/loki.yml"
    networks:
      - monitoring
    deploy:
      resources:
        limits:
          memory: 512M

  # ───────────────────────────────────────────────────────────────────────────
  # ALLOY : collecte des journaux (remplace Promtail, fin de vie)
  # - conteneurs : via le proxy de socket en lecture seule (réseau `socket-proxy`),
  #   jamais par un montage de docker.sock
  # - hôte : journal systemd monté en lecture seule
  # Tourne sous l'utilisateur de l'image (473), jamais en root. Le groupe
  # systemd-journal (GID de l'hôte, 999 ici : `getent group systemd-journal`,
  # modifiable par JOURNAL_GID dans .env) lui donne la lecture du journal.
  # ───────────────────────────────────────────────────────────────────────────
  alloy:
    image: grafana/alloy:v1.20.1@sha256:2aa2099af76c0098d4af7a4d6e48f86cb66dc1a000222ad927a1c67c6542d13f
    container_name: alloy
    restart: unless-stopped
    user: "473:473"
    group_add:
      - "${JOURNAL_GID:-999}"
    read_only: true
    <<: *hardening
    logging: *default-logging
    tmpfs:
      - /tmp
    environment:
      ALLOY_DOCKER_HOST: "tcp://socket-proxy:2375"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "--storage.path=/var/lib/alloy/data"
      - "--disable-reporting"
      - "/etc/alloy/config.alloy"
    networks:
      - monitoring
      - socket-proxy
    deploy:
      resources:
        limits:
          memory: 256M

  # ───────────────────────────────────────────────────────────────────────────
  # GRAFANA : tableaux de bord, exploration des journaux, alertes vers Discord
  # - base interne dans PostgreSQL (réseau `db`)
  # - sources de données, tableaux de bord et alertes provisionnés par fichiers
  # ───────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: grafana
    restart: unless-stopped
    user: "472:0"
    read_only: true
    <<: *hardening
    logging: *default-logging
    tmpfs:
      - /tmp
    environment:
      # Base PostgreSQL mutualisée (ADR-005)
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: grafana
      # Mot de passe du rôle PostgreSQL de Grafana : lu depuis un secret Docker (fichier
      # hors dépôt, lisible seulement par l'UID 472 de Grafana), jamais en variable
      # d'environnement (visible par docker inspect, donc par tout client du proxy de
      # socket). Le démarrage échoue si le fichier de secret manque.
      GF_DATABASE_PASSWORD__FILE: /run/secrets/grafana_db_password
      GF_DATABASE_SSL_MODE: disable
      # Adresse publique (liens des alertes) et cookies réservés à HTTPS
      GF_SERVER_ROOT_URL: https://grafana.kiwinet.me
      GF_SECURITY_COOKIE_SECURE: "true"
      # Pas d'inscription, pas d'accès anonyme
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Pas de télémétrie ni de recherche de mises à jour vers Grafana Labs
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Pas d'installation automatique de plugins depuis grafana.com au démarrage
      # (activée par défaut depuis Grafana 12) : aucun plugin supplémentaire utilisé
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Journaux sur la sortie standard seulement (système de fichiers en lecture seule)
      GF_LOG_MODE: console
      # Webhook Discord des alertes : lu par le provisionnement (secret, hors Git)
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:?DISCORD_WEBHOOK_URL manquant, voir env.example}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    secrets:
      - grafana_db_password
    networks:
      - proxy       # exposition publique via Traefik
      - monitoring  # sources de données Prometheus et Loki
      - db          # PostgreSQL mutualisé (kiwinet-services)
    deploy:
      resources:
        limits:
          memory: 384M
    labels:
      - "traefik.enable=true"
      # https://grafana.kiwinet.me : limitation de débit, puis authentification de
      # base, puis en-têtes de sécurité (middlewares définis dans dynamic.yml).
      # Décision : protection renforcée tant que WireGuard n'est pas opérationnel.
      - "traefik.http.routers.grafana.rule=Host(`grafana.kiwinet.me`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.middlewares=rate-limit@file,auth-basic@file,secure-headers@file"
      # Obligatoire : conteneur sur plusieurs réseaux (proxy, monitoring, db)
      - "traefik.docker.network=proxy"

# ─────────────────────────────────────────────────────────────────────────────
# RÉSEAUX
# ─────────────────────────────────────────────────────────────────────────────
networks:

  # Réseau frontal partagé avec Traefik (créé hors de ce dépôt)
  proxy:
    external: true

  # Réseau des bases de données (créé hors de ce dépôt)
  db:
    external: true

  # Réseau du proxy de socket Docker en lecture seule (kiwinet-services)
  socket-proxy:
    external: true

  # Réseau dédié aux métriques de Traefik : ne contient que Traefik et Prometheus.
  # Créé par kiwinet-services (traefik/docker-compose.yml) : Traefik se déploie avant.
  traefik-metrics:
    external: true

  # Réseau interne de la supervision. Nom de l'interface fixé pour que ufw puisse
  # n'autoriser que ce pont vers Node Exporter (réseau hôte).
  monitoring:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-monitoring

# ─────────────────────────────────────────────────────────────────────────────
# VOLUMES (sur le SSD système, volontairement hors du disque Data répliqué)
# ─────────────────────────────────────────────────────────────────────────────
volumes:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:

# ─────────────────────────────────────────────────────────────────────────────
# SECRETS (fichiers créés à la main sur le serveur, hors dépôt)
# ─────────────────────────────────────────────────────────────────────────────
secrets:
  grafana_db_password:
    # Propriétaire UID 472 (utilisateur de Grafana), mode 400
    file: /etc/kiwinet/secrets/grafana_db_password
