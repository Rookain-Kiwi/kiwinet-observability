# Fournisseur de tableaux de bord : les fichiers JSON de /etc/grafana/dashboards
# (dossier grafana/dashboards du dépôt) sont chargés dans le dossier « Kiwinet ».
apiVersion: 1

providers:
  - name: kiwinet
    orgId: 1
    folder: Kiwinet
    type: file
    disableDeletion: true     # un tableau retiré du dépôt n'est pas supprimé en silence
    allowUiUpdates: false     # le dépôt fait foi ; exporter en JSON pour modifier
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
